<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <title>YouTube 熱門影片搜尋器 - 進階版</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- YouTube API Utils Module -->
    <script src="youtube-api-utils.js"></script>
    <style type="text/tailwindcss">
        :root {
            --primary-color: #ea2a33;
            --secondary-color: #1f2937;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
        }
        .search-container {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #374151 100%);
        }
        .video-card {
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(234, 42, 51, 0.1);
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 圖表容器固定高度 */
        .chart-container {
            height: 256px !important;
            position: relative;
        }

        .chart-container canvas {
            max-height: 100% !important;
            height: 100% !important;
        }
        .filter-tag {
            background: rgba(234, 42, 51, 0.1);
            border: 1px solid rgba(234, 42, 51, 0.3);
        }
        .stats-icon {
            font-size: 16px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- 頂部導航 -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <svg class="h-8 w-8 text-red-500 mr-3" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10 15.65v-7.3L16.03 12M22 12c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2s10 4.48 10 10zM4 12c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8-8 3.58-8 8z"></path>
                    </svg>
                    <h1 class="text-xl font-bold">YouTube 熱門影片搜尋器</h1>
                </div>
                <nav class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors flex items-center">
                        <span class="material-symbols-outlined mr-1 text-sm">home</span>
                        首頁
                    </a>
                    <a href="youtube-search-frontend.html" class="text-white font-medium flex items-center">
                        <span class="material-symbols-outlined mr-1 text-sm">search</span>
                        影片搜尋
                    </a>
                    <a href="compare.html" class="text-gray-300 hover:text-white transition-colors flex items-center">
                        <span class="material-symbols-outlined mr-1 text-sm">analytics</span>
                        競品比較
                    </a>
                </nav>
                <div class="flex items-center space-x-4">
                    <span id="apiStatus" class="text-sm text-gray-400">準備就緒</span>
                    <button id="apiKeyBtn" class="p-2 text-gray-400 hover:text-blue-400 rounded-lg hover:bg-gray-700 transition-colors" title="API Key 設定">
                        <span class="material-symbols-outlined">key</span>
                    </button>
                    <button id="refreshBtn" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition-colors">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                    <button id="logoutBtn" class="p-2 text-gray-400 hover:text-red-400 rounded-lg hover:bg-gray-700 transition-colors" title="登出">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 搜尋區域 -->
        <div class="search-container rounded-2xl p-8 mb-8 shadow-2xl">
            <h2 class="text-3xl font-bold text-white mb-6 text-center">探索熱門影片</h2>

            <!-- 主要搜尋欄 -->
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex-1">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="搜尋關鍵字..."
                        class="w-full px-6 py-4 text-lg bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent backdrop-blur-sm"
                    />
                </div>
                <button
                    id="searchBtn"
                    class="px-8 py-4 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition-all duration-200 flex items-center justify-center min-w-[140px]"
                >
                    <span class="material-symbols-outlined mr-2">search</span>
                    搜尋
                </button>
            </div>

            <!-- 進階篩選 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <!-- 地區選擇 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">地區</label>
                    <select id="regionSelect" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-red-500">
                        <option value="">全部地區</option>
                        <option value="TW">台灣</option>
                        <option value="US">美國</option>
                        <option value="IN">印度</option>
                        <option value="BR">巴西</option>
                        <option value="ID">印尼</option>
                        <option value="MX">墨西哥</option>
                    </select>
                </div>

                <!-- 影片類型 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">類型</label>
                    <select id="typeSelect" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-red-500">
                        <option value="">全部類型</option>
                        <option value="videos">一般影片</option>
                        <option value="shorts">Shorts 短影片</option>
                    </select>
                </div>

            </div>

            <!-- 日期範圍 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">開始日期</label>
                    <input type="date" id="dateFrom" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-red-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">結束日期</label>
                    <input type="date" id="dateTo" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-red-500">
                </div>
            </div>

            <!-- 觀看數範圍 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">最小觀看數</label>
                    <input type="number" id="viewMin" placeholder="例: 1000" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-red-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">最大觀看數</label>
                    <input type="number" id="viewMax" placeholder="例: 1000000" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-red-500">
                </div>
            </div>

            <!-- 搜尋建議 -->
            <div id="suggestionsContainer" class="hidden">
                <div class="flex flex-wrap gap-2 mb-4">
                    <span class="text-sm text-gray-300 mr-2">熱門搜尋:</span>
                    <div id="suggestions" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <!-- 結果統計 -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-4">
                <h3 class="text-2xl font-bold text-white">搜尋結果</h3>
                <div id="resultStats" class="text-gray-400 text-sm"></div>
            </div>
            <div class="flex items-center space-x-4">
                <!-- 匯出按鈕 -->
                <div id="exportSection" class="hidden">
                    <button id="exportBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center space-x-2">
                        <span class="material-symbols-outlined text-sm">download</span>
                        <span>匯出 CSV</span>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-400">每頁顯示:</span>
                    <select id="pageSizeSelect" class="px-3 py-1 bg-gray-800 border border-gray-600 rounded text-white text-sm focus:ring-2 focus:ring-red-500">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 載入指示器 -->
        <div id="loadingIndicator" class="hidden text-center py-12">
            <div class="inline-flex items-center px-6 py-3 bg-gray-800 rounded-lg">
                <span class="material-symbols-outlined loading-spinner text-red-500 mr-3">hourglass_empty</span>
                <span class="text-gray-300">正在搜尋影片...</span>
            </div>
        </div>

        <!-- 錯誤訊息 -->
        <div id="errorMessage" class="hidden bg-red-900/50 border border-red-500 rounded-lg p-4 mb-6">
            <div class="flex items-center">
                <span class="material-symbols-outlined text-red-500 mr-3">error</span>
                <div>
                    <h4 class="font-semibold text-red-300">搜尋失敗</h4>
                    <p id="errorText" class="text-red-200 text-sm mt-1"></p>
                </div>
            </div>
        </div>

        <!-- 檢視模式切換 -->
        <div id="viewModeSection" class="hidden mb-6">
            <div class="flex items-center justify-center space-x-4 bg-gray-800 rounded-lg p-2">
                <button id="gridViewBtn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md transition-colors">
                    <span class="material-symbols-outlined mr-1 text-sm">grid_view</span>
                    網格檢視
                </button>
                <button id="chartViewBtn" class="px-4 py-2 text-sm font-medium text-gray-400 hover:text-white rounded-md transition-colors">
                    <span class="material-symbols-outlined mr-1 text-sm">analytics</span>
                    圖表分析
                </button>
            </div>
        </div>

        <!-- 結果排序控件 -->
        <div id="sortControls" class="hidden mb-4 flex items-center justify-between bg-gray-800 rounded-lg p-4">
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-300">排序依據:</label>
                    <select id="sortBySelect" class="px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white text-sm focus:ring-2 focus:ring-red-500">
                        <option value="relevance">相關性</option>
                        <option value="viewCount">觀看數</option>
                        <option value="likeCount">按讚數</option>
                        <option value="commentCount">留言數</option>
                        <option value="publishedAt">發布日期</option>
                    </select>
                </div>

                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-300">排序:</label>
                    <select id="sortOrderSelect" class="px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white text-sm focus:ring-2 focus:ring-red-500">
                        <option value="desc">降序</option>
                        <option value="asc">升序</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 影片結果網格 -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 mb-8">
            <!-- 影片卡片將在這裡動態生成 -->
        </div>

        <!-- 圖表分析檢視 -->
        <div id="chartView" class="hidden mb-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 觀看數分布圖 -->
                <div class="bg-gray-800 rounded-xl p-6">
                    <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                        <span class="material-symbols-outlined mr-2">bar_chart</span>
                        觀看數分布
                    </h3>
                    <div class="chart-container">
                        <canvas id="viewCountChart"></canvas>
                    </div>
                </div>

                <!-- 發布時間趨勢圖 -->
                <div class="bg-gray-800 rounded-xl p-6">
                    <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                        <span class="material-symbols-outlined mr-2">trending_up</span>
                        發布時間趨勢
                    </h3>
                    <div class="chart-container">
                        <canvas id="publishTrendChart"></canvas>
                    </div>
                </div>

                <!-- 影片類型分布 -->
                <div class="bg-gray-800 rounded-xl p-6">
                    <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                        <span class="material-symbols-outlined mr-2">pie_chart</span>
                        影片類型分布
                    </h3>
                    <div class="chart-container">
                        <canvas id="videoTypeChart"></canvas>
                    </div>
                </div>

                <!-- 按讚率分析 -->
                <div class="bg-gray-800 rounded-xl p-6">
                    <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                        <span class="material-symbols-outlined mr-2">scatter_plot</span>
                        按讚率 vs 觀看數
                    </h3>
                    <div class="chart-container">
                        <canvas id="engagementChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 圖表洞察 -->
            <div id="chartInsights" class="bg-gray-800 rounded-xl p-6 mt-6">
                <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                    <span class="material-symbols-outlined mr-2">lightbulb</span>
                    數據洞察
                </h3>
                <div id="insightsList" class="space-y-3">
                    <!-- 洞察內容將在這裡動態生成 -->
                </div>
            </div>
        </div>


        <!-- 無結果提示 -->
        <div id="noResults" class="hidden text-center py-16">
            <span class="material-symbols-outlined text-6xl text-gray-600 mb-4 block">search_off</span>
            <h3 class="text-xl font-semibold text-gray-400 mb-2">沒有找到相關影片</h3>
            <p class="text-gray-500">試試調整搜尋條件或關鍵字</p>
        </div>

        <!-- 分頁控制 -->
        <div id="paginationContainer" class="hidden flex items-center justify-between bg-gray-800 rounded-lg p-4">
            <div class="text-sm text-gray-400">
                顯示第 <span id="pageRange">1-20</span> 筆，共 <span id="totalCount">0</span> 筆結果
            </div>
            <div class="flex items-center space-x-2">
                <button id="prevPageBtn" class="p-2 text-gray-400 hover:text-white disabled:opacity-50 disabled:cursor-not-allowed rounded-lg hover:bg-gray-700 transition-colors" disabled>
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <div id="pageNumbers" class="flex items-center space-x-1">
                    <!-- 頁碼按鈕將在這裡生成 -->
                </div>
                <button id="nextPageBtn" class="p-2 text-gray-400 hover:text-white disabled:opacity-50 disabled:cursor-not-allowed rounded-lg hover:bg-gray-700 transition-colors">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        // ==================== API Key 檢查 ====================

        // 登出功能（清除 API Key）
        function logout() {
            if (confirm('確定要登出嗎？這會清除您的 API Key 設定。')) {
                localStorage.removeItem('youtubeApiKey');
                localStorage.removeItem('apiKeySetTime');
                alert('已登出，API Key 已清除');
                window.location.href = 'index.html';
            }
        }

        // 檢查用戶是否已設定 API Key
        function checkApiKey() {
            const apiKey = localStorage.getItem('youtubeApiKey');

            if (!apiKey) {
                alert('請先設定 YouTube API Key 才能使用此工具');
                window.location.href = 'index.html';
                return false;
            }

            return apiKey;
        }

        // 頁面載入時檢查 API Key
        const userApiKey = checkApiKey();
        if (!userApiKey) {
            throw new Error('API Key not found');
        }

        // 初始化 YouTube API Utils
        YOUTUBE_API_UTILS.init({
            apiKey: userApiKey
        });

        // ==================== 全域變數 ====================

        // 應用程式狀態
        const appState = {
            currentPage: 1,
            pageSize: 20,
            totalResults: 0,
            currentFilters: {},
            searchResults: [],
            loading: false
        };

        // DOM 元素引用
        const elements = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            regionSelect: document.getElementById('regionSelect'),
            typeSelect: document.getElementById('typeSelect'),
            sortBySelect: document.getElementById('sortBySelect'),
            sortOrderSelect: document.getElementById('sortOrderSelect'),
            dateFrom: document.getElementById('dateFrom'),
            dateTo: document.getElementById('dateTo'),
            viewMin: document.getElementById('viewMin'),
            viewMax: document.getElementById('viewMax'),
            pageSizeSelect: document.getElementById('pageSizeSelect'),

            loadingIndicator: document.getElementById('loadingIndicator'),
            errorMessage: document.getElementById('errorMessage'),
            errorText: document.getElementById('errorText'),
            videoGrid: document.getElementById('videoGrid'),
            noResults: document.getElementById('noResults'),

            resultStats: document.getElementById('resultStats'),
            paginationContainer: document.getElementById('paginationContainer'),
            pageRange: document.getElementById('pageRange'),
            totalCount: document.getElementById('totalCount'),
            pageNumbers: document.getElementById('pageNumbers'),
            prevPageBtn: document.getElementById('prevPageBtn'),
            nextPageBtn: document.getElementById('nextPageBtn'),

            suggestionsContainer: document.getElementById('suggestionsContainer'),
            suggestions: document.getElementById('suggestions'),
            refreshBtn: document.getElementById('refreshBtn'),
            apiStatus: document.getElementById('apiStatus'),
            apiKeyBtn: document.getElementById('apiKeyBtn'),
            logoutBtn: document.getElementById('logoutBtn'),

            exportSection: document.getElementById('exportSection'),
            exportBtn: document.getElementById('exportBtn'),

            viewModeSection: document.getElementById('viewModeSection'),
            gridViewBtn: document.getElementById('gridViewBtn'),
            chartViewBtn: document.getElementById('chartViewBtn'),
            chartView: document.getElementById('chartView'),
            insightsList: document.getElementById('insightsList'),
            sortControls: document.getElementById('sortControls')
        };

        // ==================== CSV 匯出功能 ====================

        /**
         * 將搜尋結果匯出為 CSV
         */
        function exportToCSV() {
            if (!appState.searchResults || appState.searchResults.length === 0) {
                alert('沒有可匯出的搜尋結果');
                return;
            }

            try {
                // 1. 準備 CSV 標頭
                const headers = [
                    '影片標題',
                    '頻道名稱',
                    '影片ID',
                    'YouTube連結',
                    '發布日期',
                    '影片長度(秒)',
                    '觀看數',
                    '按讚數',
                    '留言數',
                    '按讚率(%)',
                    '影片類型',
                    'Hashtags',
                    '搜尋關鍵字',
                    '搜尋地區',
                    '匯出時間',
                    '搜尋條件'
                ];

                // 2. 準備搜尋條件摘要
                const searchSummary = generateSearchSummary();
                const exportTime = new Date().toLocaleString('zh-TW');

                // 3. 轉換數據為 CSV 行
                const csvRows = appState.searchResults.map(video => {
                    const likeRate = video.viewCount > 0 ?
                        ((video.likeCount / video.viewCount) * 100).toFixed(2) : '0.00';

                    const videoType = video.durationSeconds <= 60 ? 'Shorts' : '一般影片';

                    const hashtags = video.hashtags ? video.hashtags.join(';') : '';

                    return [
                        escapeCsvField(video.title),
                        escapeCsvField(video.channelTitle),
                        video.videoId,
                        video.url,
                        formatDateForCSV(video.publishedAt),
                        video.durationSeconds,
                        video.viewCount,
                        video.likeCount,
                        video.commentCount,
                        likeRate,
                        videoType,
                        escapeCsvField(hashtags),
                        escapeCsvField(appState.currentFilters.keyword || ''),
                        escapeCsvField(getRegionName(appState.currentFilters.region)),
                        exportTime,
                        escapeCsvField(searchSummary)
                    ];
                });

                // 4. 組合 CSV 內容
                const csvContent = [headers, ...csvRows]
                    .map(row => row.join(','))
                    .join('\n');

                // 5. 下載 CSV 檔案
                downloadCSV(csvContent, generateFileName());

                // 6. 顯示成功訊息
                showExportSuccess(appState.searchResults.length);

            } catch (error) {
                console.error('Export error:', error);
                alert('匯出失敗，請稍後再試');
            }
        }

        /**
         * 轉義 CSV 欄位（處理逗號、引號、換行）
         */
        function escapeCsvField(field) {
            if (field == null) return '';

            const str = String(field);

            // 如果包含逗號、引號或換行，需要用引號包圍並轉義內部引號
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                return '"' + str.replace(/"/g, '""') + '"';
            }

            return str;
        }

        /**
         * 格式化日期為 CSV 格式
         */
        function formatDateForCSV(dateString) {
            if (!dateString) return '';

            const date = new Date(dateString);
            return date.toLocaleDateString('zh-TW') + ' ' + date.toLocaleTimeString('zh-TW');
        }

        /**
         * 生成搜尋條件摘要
         */
        function generateSearchSummary() {
            const filters = appState.currentFilters;
            const conditions = [];

            if (filters.keyword) conditions.push(`關鍵字:${filters.keyword}`);
            if (filters.region) conditions.push(`地區:${getRegionName(filters.region)}`);
            if (filters.type) conditions.push(`類型:${filters.type === 'shorts' ? 'Shorts' : '一般影片'}`);
            if (filters.dateFrom) conditions.push(`開始日期:${filters.dateFrom}`);
            if (filters.dateTo) conditions.push(`結束日期:${filters.dateTo}`);
            if (filters.viewMin) conditions.push(`最小觀看數:${filters.viewMin.toLocaleString()}`);
            if (filters.viewMax) conditions.push(`最大觀看數:${filters.viewMax.toLocaleString()}`);

            return conditions.length > 0 ? conditions.join(', ') : '無特定條件';
        }

        /**
         * 取得地區中文名稱
         */
        function getRegionName(regionCode) {
            const regionNames = {
                'TW': '台灣',
                'US': '美國',
                'IN': '印度',
                'BR': '巴西',
                'ID': '印尼',
                'MX': '墨西哥'
            };
            return regionNames[regionCode] || regionCode || '全球';
        }

        /**
         * 生成檔案名稱
         */
        function generateFileName() {
            const now = new Date();
            const dateStr = now.getFullYear() +
                          String(now.getMonth() + 1).padStart(2, '0') +
                          String(now.getDate()).padStart(2, '0') + '_' +
                          String(now.getHours()).padStart(2, '0') +
                          String(now.getMinutes()).padStart(2, '0');

            const keyword = appState.currentFilters.keyword || '搜尋結果';
            const region = getRegionName(appState.currentFilters.region);

            return `YouTube搜尋結果_${keyword}_${region}_${dateStr}.csv`;
        }

        /**
         * 下載 CSV 檔案
         */
        function downloadCSV(csvContent, fileName) {
            // 加入 BOM 確保中文正確顯示
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csvContent], {
                type: 'text/csv;charset=utf-8;'
            });

            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);
        }

        /**
         * 生成數據洞察
         */
        function generateInsights(videos) {
            const insights = [];

            // 計算統計數據
            const totalVideos = videos.length;
            const totalViews = videos.reduce((sum, v) => sum + v.viewCount, 0);
            const avgViews = Math.round(totalViews / totalVideos);

            const shortsCount = videos.filter(v => v.durationSeconds <= 60).length;
            const shortsPercentage = Math.round((shortsCount / totalVideos) * 100);

            const highEngagement = videos.filter(v =>
                v.viewCount > 0 && (v.likeCount / v.viewCount) > 0.05
            ).length;
            const highEngagementPercentage = Math.round((highEngagement / totalVideos) * 100);

            // 找出最熱門的影片
            const mostPopular = videos.reduce((max, v) =>
                v.viewCount > max.viewCount ? v : max
            );

            // 生成洞察
            insights.push(`📊 共分析 ${totalVideos} 支影片，總觀看數 ${totalViews.toLocaleString()} 次`);
            insights.push(`📈 平均觀看數為 ${avgViews.toLocaleString()} 次`);
            insights.push(`🎬 Shorts 占比 ${shortsPercentage}%，一般影片 ${100-shortsPercentage}%`);
            insights.push(`👍 ${highEngagementPercentage}% 的影片有高互動率 (按讚率 > 5%)`);
            insights.push(`🏆 最熱門影片：《${mostPopular.title.substring(0, 30)}...》(${mostPopular.viewCount.toLocaleString()} 次觀看)`);

            // 發布時間分析
            const recentVideos = videos.filter(v => {
                const daysDiff = (Date.now() - new Date(v.publishedAt)) / (1000 * 60 * 60 * 24);
                return daysDiff <= 7;
            }).length;

            if (recentVideos > 0) {
                insights.push(`🔥 ${Math.round((recentVideos/totalVideos)*100)}% 的影片是最近一週發布的`);
            }

            // 渲染洞察
            elements.insightsList.innerHTML = insights.map(insight =>
                `<div class="text-gray-300 text-sm flex items-start">
                    <span class="mr-2">${insight.split(' ')[0]}</span>
                    <span>${insight.substring(insight.indexOf(' ') + 1)}</span>
                </div>`
            ).join('');
        }

        /**
         * 格式化數字顯示
         */
        function formatNumber(num) {
            if (!num || isNaN(num)) return '0';
            const n = parseInt(num);
            if (n >= 1000000) {
                return (n / 1000000).toFixed(1) + 'M';
            } else if (n >= 1000) {
                return (n / 1000).toFixed(1) + 'K';
            }
            return n.toLocaleString();
        }

        /**
         * 格式化影片長度
         */
        function formatDuration(seconds) {
            if (!seconds) return '--:--';

            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // ==================== 搜尋流程 ====================





        /**
         * 執行完整搜尋流程
         */
        async function performSearch() {
            if (appState.loading) return;

            try {
                appState.loading = true;
                hideError();
                showLoading(true);
                updateApiStatus('搜尋中...', 'text-yellow-400');

                // 收集搜尋參數
                const params = collectSearchParams();
                appState.currentFilters = params;

                // 1. 先搜尋影片列表
                const searchResults = await YOUTUBE_API_UTILS.searchVideos(params);

                if (!searchResults.items || searchResults.items.length === 0) {
                    handleSearchResponse({ items: [], total: 0 });
                    updateApiStatus('搜尋完成', 'text-green-400');
                    return;
                }

                // 2. 取得影片詳細資訊
                const videoIds = searchResults.items.map(item => item.id.videoId);
                const videoDetails = await YOUTUBE_API_UTILS.getVideoDetails(videoIds);

                // 3. 合併資料並篩選
                const videos = YOUTUBE_API_UTILS.mergeVideoData(searchResults.items, videoDetails.items);
                const filteredVideos = applyViewCountFilter(videos, params);

                // 4. 處理分頁
                const paginatedResults = {
                    items: filteredVideos,
                    total: filteredVideos.length,
                    pageInfo: searchResults.pageInfo,
                    nextPageToken: searchResults.nextPageToken,
                    prevPageToken: searchResults.prevPageToken
                };

                handleSearchResponse(paginatedResults);
                updateApiStatus('搜尋完成', 'text-green-400');

            } catch (error) {
                console.error('Search error:', error);
                showError(`搜尋失敗: ${error.message}`);
            } finally {
                appState.loading = false;
                showLoading(false);
            }
        }




        /**
         * 根據觀看數範圍篩選影片
         */
        function applyViewCountFilter(videos, params) {
            return videos.filter(video => {
                const viewCount = video.viewCount;

                if (params.viewMin && viewCount < params.viewMin) {
                    return false;
                }

                if (params.viewMax && viewCount > params.viewMax) {
                    return false;
                }

                return true;
            });
        }

        /**
         * 收集搜尋參數
         */
        function collectSearchParams() {
            return {
                keyword: elements.searchInput.value.trim(),
                region: elements.regionSelect.value,
                type: elements.typeSelect.value,
                dateFrom: elements.dateFrom.value,
                dateTo: elements.dateTo.value,
                viewMin: elements.viewMin.value ? parseInt(elements.viewMin.value) : null,
                viewMax: elements.viewMax.value ? parseInt(elements.viewMax.value) : null,
                page: appState.currentPage,
                size: appState.pageSize
            };
        }

        /**
         * 處理搜尋回應
         */
        function handleSearchResponse(data) {
            appState.searchResults = data.items || [];
            appState.totalResults = data.total || 0;

            updateResultStats(data.total || 0, appState.currentPage, appState.pageSize);

            if (data.nextPageToken || data.prevPageToken) {
                // 有分頁 token，顯示分頁控制
                const totalPages = Math.ceil(data.total / appState.pageSize);
                updatePagination(appState.currentPage, totalPages, data.total, appState.pageSize);
            } else {
                // 沒有分頁資訊，隱藏分頁控制
                elements.paginationContainer.classList.add('hidden');
            }

            // 顯示或隱藏匯出按鈕、檢視模式切換和排序控件
            if (appState.searchResults.length > 0) {
                elements.exportSection.classList.remove('hidden');
                elements.viewModeSection.classList.remove('hidden');
                elements.sortControls.classList.remove('hidden');
            } else {
                elements.exportSection.classList.add('hidden');
                elements.viewModeSection.classList.add('hidden');
                elements.sortControls.classList.add('hidden');
            }

            displayResults(appState.searchResults);
        }

        function showLoading(show) {

                elements.videoGrid.classList.add('hidden');

        /**
         * 排序影片結果
         */
        function sortVideos(videos, sortBy, sortOrder) {
            if (!videos || videos.length === 0) return videos;

            const sortedVideos = [...videos].sort((a, b) => {
                let aValue, bValue;

                switch (sortBy) {
                    case 'viewCount':
                        aValue = parseInt(a.viewCount) || 0;
                        bValue = parseInt(b.viewCount) || 0;
                        break;
                    case 'likeCount':
                        aValue = parseInt(a.likeCount) || 0;
                        bValue = parseInt(b.likeCount) || 0;
                        break;
                    case 'commentCount':
                        aValue = parseInt(a.commentCount) || 0;
                        bValue = parseInt(b.commentCount) || 0;
                        break;
                    case 'publishedAt':
                        aValue = new Date(a.publishedAt);
                        bValue = new Date(b.publishedAt);
                        break;
                    case 'relevance':
                    default:
                        // 相關性排序保持原始順序
                        return 0;
                }

                if (sortOrder === 'asc') {
                    return aValue - bValue;
                } else {
                    return bValue - aValue;
                }
            });

            return sortedVideos;
        }

        /**
         * 顯示搜尋結果
         */
        function displayResults(videos) {
            elements.videoGrid.innerHTML = '';

            if (!videos || videos.length === 0) {
                elements.videoGrid.classList.add('hidden');
                elements.noResults.classList.remove('hidden');
                return;
            }

            // 排序影片結果
            const sortBy = elements.sortBySelect.value;
            const sortOrder = elements.sortOrderSelect.value;
            const sortedVideos = sortVideos(videos, sortBy, sortOrder);

            elements.videoGrid.classList.remove('hidden');
            elements.noResults.classList.add('hidden');

            sortedVideos.forEach(video => {
                const videoCard = createVideoCard(video);
                elements.videoGrid.appendChild(videoCard);
            });
        }

                '<span class="bg-blue-500 text-white text-xs px-2 py-1 rounded">影片</span>';

            card.innerHTML = `
                <div class="relative group">

                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">

                        </a>
                    </div>
                    <div class="absolute top-2 left-2">
                        ${typeTag}
                    </div>
                    <div class="absolute bottom-2 right-2 bg-black bg-opacity-70 text-white text-xs px-2 py-1 rounded">
                        ${formatDuration(video.durationSeconds)}
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-semibold text-white text-sm leading-tight mb-2 line-clamp-2 h-10">
                        ${video.title}
                    </h3>
                    <p class="text-gray-400 text-xs mb-3 truncate">${video.channelTitle}</p>

                    <div class="flex items-center justify-between text-xs text-gray-500 mb-3">
                        <span class="flex items-center gap-1">
                            <span class="material-symbols-outlined stats-icon">visibility</span>
                            <span>${formatNumber(video.viewCount)}</span>
                        </span>
                        <span class="flex items-center gap-1">
                            <span class="material-symbols-outlined stats-icon">thumb_up</span>
                            <span>${formatNumber(video.likeCount)}</span>
                        </span>
                        <span class="flex items-center gap-1">
                            <span class="material-symbols-outlined stats-icon">comment</span>
                            <span>${formatNumber(video.commentCount)}</span>
                        </span>
                    </div>

                    ${video.hashtags && video.hashtags.length > 0 ? `
                        <div class="flex flex-wrap gap-1">
                            ${video.hashtags.slice(0, 3).map(tag =>
                                `<span class="filter-tag text-xs px-2 py-1 rounded-full text-red-300">${tag}</span>`
                            ).join('')}
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        /**
         * 更新結果統計
         */
        function updateResultStats(total, page, size) {
            if (total === 0) {
                elements.resultStats.textContent = '沒有找到結果';
            } else {
                const start = (page - 1) * size + 1;
                const end = Math.min(page * size, total);
                elements.resultStats.textContent = `共找到 ${total.toLocaleString()} 個結果`;
            }
        }

        /**
         * 更新分頁控制
         */
        function updatePagination(currentPage, totalPages, total, size) {
            if (totalPages <= 1) {
                elements.paginationContainer.classList.add('hidden');
                return;
            }

            elements.paginationContainer.classList.remove('hidden');

            // 更新頁面資訊
            const start = (currentPage - 1) * size + 1;
            const end = Math.min(currentPage * size, total);
            elements.pageRange.textContent = `${start}-${end}`;
            elements.totalCount.textContent = total.toLocaleString();

            // 更新按鈕狀態
            elements.prevPageBtn.disabled = currentPage <= 1;
            elements.nextPageBtn.disabled = currentPage >= totalPages;

            // 生成頁碼按鈕
            generatePageNumbers(currentPage, totalPages);
        }

        /**
         * 生成頁碼按鈕
         */
        function generatePageNumbers(currentPage, totalPages) {
            elements.pageNumbers.innerHTML = '';

            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const button = document.createElement('button');
                button.className = `px-3 py-1 text-sm rounded-lg transition-colors ${
                    i === currentPage
                        ? 'bg-red-500 text-white'
                        : 'text-gray-400 hover:text-white hover:bg-gray-700'
                }`;
                button.textContent = i;
                button.onclick = () => goToPage(i);
                elements.pageNumbers.appendChild(button);
            }
        }

        /**
         * 跳轉到指定頁面
         */
        function goToPage(page) {
            appState.currentPage = page;
            // 切換到網格檢視並執行搜尋
            switchViewMode('grid');
            performSearch();
        }

        // ==================== 事件處理 ====================

        /**
         * 初始化事件監聽器
         */
        function initializeEventListeners() {
            // 搜尋相關事件
            elements.searchBtn.addEventListener('click', () => {
                appState.currentPage = 1;
                performSearch();
            });

            elements.searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    appState.currentPage = 1;
                    performSearch();
                }
            });

            // 移除篩選條件自動搜尋功能，避免浪費 API 調用次數
            // 使用者需手動點擊搜尋按鈕才會執行搜尋

            // 每頁顯示數量變更（這個保留自動搜尋，因為是在有結果的情況下調整顯示）
            elements.pageSizeSelect.addEventListener('change', () => {
                appState.pageSize = parseInt(elements.pageSizeSelect.value);
                appState.currentPage = 1;
                // 只有在有搜尋結果時才重新搜尋
                if (appState.totalResults > 0) {
                    // 切換到網格檢視並執行搜尋
                    switchViewMode('grid');
                    performSearch();
                }
            });

            // 分頁按鈕
            elements.prevPageBtn.addEventListener('click', () => {
                if (appState.currentPage > 1) {
                    goToPage(appState.currentPage - 1);
                }
            });

            elements.nextPageBtn.addEventListener('click', () => {
                goToPage(appState.currentPage + 1);
            });

            // API Key 設定按鈕
            elements.apiKeyBtn.addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            // 重新整理按鈕
            elements.refreshBtn.addEventListener('click', () => {
                location.reload();
            });

            // 登出按鈕
            elements.logoutBtn.addEventListener('click', logout);

            // 匯出按鈕
            elements.exportBtn.addEventListener('click', exportToCSV);

            // 檢視模式切換
            elements.gridViewBtn.addEventListener('click', () => switchViewMode('grid'));
            elements.chartViewBtn.addEventListener('click', () => switchViewMode('chart'));

            // 排序變更事件監聽器
            elements.sortBySelect.addEventListener('change', () => {
                if (appState.searchResults && appState.searchResults.length > 0) {
                    displayResults(appState.searchResults);
                }
            });

            elements.sortOrderSelect.addEventListener('change', () => {
                if (appState.searchResults && appState.searchResults.length > 0) {
                    displayResults(appState.searchResults);
                }
            });
        }

        /**
         * 初始化預設值
         */
        function initializeDefaults() {
            // 設定預設日期範圍（最近 7 天）
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            elements.dateTo.value = today.toISOString().split('T')[0];
            elements.dateFrom.value = weekAgo.toISOString().split('T')[0];

            // 檢查 API Key 是否有效
            if (!YOUTUBE_API_UTILS.hasApiKey()) {
                showError('API Key 遺失，請重新設定');
                updateApiStatus('API Key 錯誤', 'text-red-400');
                return;
            }

            updateApiStatus('準備就緒', 'text-green-400');
        }

        /**
         * 載入搜尋建議（基於熱門關鍵字）
         */
        async function loadSuggestions() {
            try {
                // 使用一些預設的熱門搜尋建議
                const defaultSuggestions = [
                    { text: '台灣' },
                    { text: 'trending' },
                    { text: '音樂' },
                    { text: '遊戲' },
                    { text: '新聞' },
                    { text: '料理' },
                    { text: 'vlog' },
                    { text: '教學' }
                ];

                displaySuggestions(defaultSuggestions);

                // TODO: 未來可以實作更智慧的建議系統
                // 例如：基於 YouTube Trends API 或 Google Trends
            } catch (error) {
                console.error('Failed to load suggestions:', error);
            }
        }

        /**
         * 顯示搜尋建議
         */
        function displaySuggestions(suggestions) {
            elements.suggestions.innerHTML = '';

            suggestions.forEach(suggestion => {
                const button = document.createElement('button');
                button.className = 'filter-tag text-xs px-3 py-1 rounded-full text-red-300 hover:bg-red-500 hover:text-white transition-colors';
                button.textContent = suggestion.text;
                button.onclick = () => {
                    elements.searchInput.value = suggestion.text;
                    performSearch();
                };
                elements.suggestions.appendChild(button);
            });

            elements.suggestionsContainer.classList.remove('hidden');
        }

        // ==================== 初始化 ====================

        document.addEventListener('DOMContentLoaded', () => {
            console.log('YouTube 搜尋器初始化中...');

            initializeEventListeners();
            initializeDefaults();
            loadSuggestions();

            console.log('YouTube 搜尋器初始化完成');
        });
    </script>
</body>
</html>
