<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階開發指南 - YouTube 熱門影片搜尋器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.5.x/dist/typography.min.css"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation Header -->
    <header class="bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-lg sm:text-xl font-bold text-gray-800 truncate pr-4">進階開發指南</h1>
            <a href="../index.html" class="inline-flex items-center gap-2 bg-gray-700 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-gray-800 transition-colors flex-shrink-0">
                <span class="material-symbols-outlined" style="font-size: 1.25rem;">arrow_back</span>
                返回首頁
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mt-6 sm:mt-8">
        <div id="html-content" class="prose max-w-4xl mx-auto p-6 sm:p-8 bg-white rounded-lg shadow-md">
            <p>Loading...</p>
        </div>
    </main>

    <footer class="text-center py-6 text-sm text-gray-500">
        <p>&copy; 2025 YouTube 熱門影片搜尋器. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const markdownFile = 'DEVELOPER_GUIDE.md';
            const contentDiv = document.getElementById('html-content');
            
            fetch(markdownFile)
                .then(response => {
                    if (!response.ok) {
                        return Promise.reject(`File not found or network error: ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(markdownText => {
                    const converter = new showdown.Converter({
                        tables: true,
                        strikethrough: true,
                        tasklists: true,
                        openLinksInNewWindow: true,
                        simplifiedAutoLink: true
                    });
                    contentDiv.innerHTML = converter.makeHtml(markdownText);
                })
                .catch(error => {
                    console.error('Error fetching or rendering markdown:', error);
                    contentDiv.innerHTML = `<p class="text-red-500 font-bold">Error loading document.</p><p class="text-red-700">${error}</p>`;
                });
        });
    </script>
</body>
</html>
